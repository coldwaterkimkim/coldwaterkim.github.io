<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나사잡 기록으로 이동 — coldwaterkim</title><link rel="canonical" href="https://coldwaterkim.com/"></head>
<body><p>나사잡 기록을 통합 피드에서 볼 수 있어요. <a id="recordDestination" href="/#nasajab">나사잡 피드로 이동</a></p>
<script type="module">
let id = '';
try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* Invalid fragments fall back to the category. */ }
const destination = id ? '/#record/' + encodeURIComponent('nasajab:' + id) : '/#nasajab';
document.getElementById('recordDestination').href = destination;
location.replace(destination);
</script></body></html>
