<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>미디어 — coldwaterkim OWNER MODE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1>★ coldwaterkim OWNER MODE ★</h1>
            <div>
                <a href="../index.html">🏠 홈으로</a> |
                <a href="#" id="logoutBtn">🚪 로그아웃</a>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="admin-nav">
            <a href="/">🏠 사이트 보기</a>
            <a href="/admin/write.html">✍️ 통합 글쓰기</a>
            <a href="/admin/posts.html">📝 글 관리</a>
            <a href="/admin/daily.html">📅 나으 하루</a>
            <a href="/admin/media.html" class="active">🖼️ 미디어</a>
            <a href="/admin/guestbook.html">💬 방명록</a>
        </nav>

        <!-- Content -->
        <div class="admin-content">
            <h2 style="margin-top: 0;">🖼️ 미디어 라이브러리</h2>

            <div id="alert" class="alert" role="status" aria-live="polite" style="display: none;"></div>

            <!-- 업로드 영역 -->
            <div class="admin-panel">
                <h2>📤 파일 업로드</h2>
                <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-controls="fileInput">
                    <p>📁 여기에 파일을 드래그하거나 클릭하여 업로드</p>
                    <p style="font-size: 12px; color: #888;">이미지, 영상, MP3, PDF (영상 최대 20GB)</p>
                </div>
                <input type="file" id="fileInput" style="display: none;" multiple accept="image/*,video/*,audio/*,.pdf">
                <div id="uploadProgress" style="margin-top: 8px; display: none;">
                    <progress id="progressBar" value="0" max="100" style="width: 100%;"></progress>
                    <span id="progressText">업로드 중...</span>
                </div>
            </div>

            <!-- 미디어 목록 -->
            <div class="admin-panel">
                <h2>📂 업로드된 파일</h2>
                <div id="mediaGrid" class="media-grid">
                    <div class="loading">불러오는 중</div>
                </div>
                <div class="pagination" id="pagination" style="margin-top: 16px;"></div>
            </div>

            <!-- 선택된 파일 정보 -->
            <div id="selectedMedia" class="admin-panel" style="display: none;">
                <h2>📋 파일 정보</h2>
                <div id="mediaInfo"></div>
                <div class="form-group" style="margin-top: 12px;">
                    <label for="mediaUrl">파일 URL (복사해서 글에 사용)</label>
                    <input type="text" id="mediaUrl" readonly>
                </div>
                <div class="action-buttons">
                    <button class="btn" id="copyUrlBtn">📋 URL 복사</button>
                    <button class="btn btn-danger" id="deleteMediaBtn">🗑️ 삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { pb, isLoggedIn, logout, uploadMedia, getMediaList, deleteMedia, formatDate, cmsErrorMessage, getMediaUrl } from '../js/pb.js';

        // 인증 체크
        if (!isLoggedIn()) {
            window.location.replace('/admin/login.html');
            await new Promise(() => { });
        }

        // 로그아웃
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
            window.location.href = '/admin/login.html';
        });

        // 상태
        let currentPage = 1;
        let selectedMediaId = null;

        // 알림
        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type}`;
            alertEl.style.display = 'block';
            setTimeout(() => alertEl.style.display = 'none', 5000);
        }

        // 드롭존 설정
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const mediaUrlInput = document.getElementById('mediaUrl');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            fileInput.click();
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        mediaUrlInput.addEventListener('click', () => mediaUrlInput.select());
        document.getElementById('copyUrlBtn').addEventListener('click', copyUrl);
        document.getElementById('deleteMediaBtn').addEventListener('click', deleteSelectedMedia);

        // 파일 업로드 처리
        async function handleFiles(files) {
            const uploadProgress = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            uploadProgress.style.display = 'block';
            let uploadedCount = 0;
            let failedCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressText.textContent = `업로드 중... (${i + 1}/${files.length}) ${file.name}`;
                progressBar.value = ((i + 1) / files.length) * 100;

                try {
                    await uploadMedia(file);
                    uploadedCount += 1;
                } catch (e) {
                    failedCount += 1;
                    showAlert(`업로드 실패 (${file.name}): ${cmsErrorMessage(e)}`, 'error');
                }
            }

            uploadProgress.style.display = 'none';
            fileInput.value = '';
            if (uploadedCount > 0 && failedCount === 0) {
                showAlert(`${uploadedCount}개 파일이 업로드되었습니다.`, 'success');
            } else if (uploadedCount > 0) {
                showAlert(`${uploadedCount}개 업로드, ${failedCount}개 실패. 실패한 파일은 메시지를 확인해줘.`, 'error');
            }
            loadMedia(1);
        }

        // 미디어 목록 로드
        async function loadMedia(page = 1) {
            const grid = document.getElementById('mediaGrid');
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.textContent = '불러오는 중';
            grid.replaceChildren(loading);

            try {
                const result = await getMediaList(page, 12);
                currentPage = page;

                if (result.items.length === 0) {
                    const empty = document.createElement('p');
                    empty.textContent = '업로드된 파일이 없습니다.';
                    grid.replaceChildren(empty);
                    renderPagination(0, page);
                    return;
                }

                const mediaItems = result.items.map(item => {
                    const url = getMediaUrl(item, item.file);
                    const isImage = item.file.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                    const isVideo = item.file.match(/\.(mp4|webm)$/i);
                    const isAudio = item.file.match(/\.(mp3|wav)$/i);

                    const mediaItem = document.createElement('div');
                    mediaItem.className = 'media-item';
                    mediaItem.tabIndex = 0;
                    mediaItem.setAttribute('role', 'button');
                    mediaItem.setAttribute('aria-label', `파일 선택: ${item.file}`);

                    if (isImage) {
                        const preview = document.createElement('img');
                        preview.src = url;
                        preview.alt = item.alt_text || item.file;
                        preview.loading = 'lazy';
                        preview.decoding = 'async';
                        mediaItem.append(preview);
                    } else if (isVideo) {
                        const preview = document.createElement('video');
                        preview.src = url;
                        preview.preload = 'none';
                        preview.setAttribute('aria-label', item.alt_text || item.file);
                        mediaItem.append(preview, mediaIcon('🎬'));
                    } else if (isAudio) {
                        mediaItem.append(mediaIcon('🎵'));
                    } else {
                        mediaItem.append(mediaIcon('📄'));
                    }

                    const filename = document.createElement('div');
                    filename.className = 'filename';
                    filename.textContent = item.file;
                    mediaItem.append(filename);

                    mediaItem.addEventListener('click', () => selectMedia(item.id));
                    mediaItem.addEventListener('keydown', (event) => {
                        if (event.key !== 'Enter' && event.key !== ' ') return;
                        event.preventDefault();
                        selectMedia(item.id);
                    });
                    return mediaItem;
                });
                grid.replaceChildren(...mediaItems);

                // 페이지네이션
                renderPagination(result.totalPages, page);
            } catch (e) {
                const error = document.createElement('p');
                error.textContent = `불러오기 실패: ${cmsErrorMessage(e)}`;
                grid.replaceChildren(error);
            }
        }

        function mediaIcon(icon) {
            const element = document.createElement('div');
            element.style.fontSize = '48px';
            element.setAttribute('aria-hidden', 'true');
            element.textContent = icon;
            return element;
        }

        // 페이지네이션
        function renderPagination(totalPages, currentPage) {
            const paginationEl = document.getElementById('pagination');
            if (totalPages <= 1) {
                paginationEl.replaceChildren();
                return;
            }

            const pages = [];
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    const current = document.createElement('span');
                    current.className = 'current';
                    current.setAttribute('aria-current', 'page');
                    current.textContent = String(i);
                    pages.push(current);
                } else {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = String(i);
                    link.addEventListener('click', (event) => {
                        event.preventDefault();
                        loadMedia(i);
                    });
                    pages.push(link);
                }
            }
            paginationEl.replaceChildren(...pages);
        }

        // 미디어 선택
        async function selectMedia(id) {
            try {
                const item = await pb.collection('media').getOne(id);
                selectedMediaId = id;

                const url = getMediaUrl(item, item.file);
                const isImage = item.file.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                const isVideo = item.file.match(/\.(mp4|webm)$/i);
                const isAudio = item.file.match(/\.(mp3|wav)$/i);

                const mediaInfo = document.getElementById('mediaInfo');
                const details = [];
                if (isImage) {
                    const preview = document.createElement('img');
                    preview.src = url;
                    preview.alt = item.alt_text || item.file;
                    preview.style.maxWidth = '100%';
                    preview.style.maxHeight = '200px';
                    details.push(preview);
                } else if (isVideo) {
                    const preview = document.createElement('video');
                    preview.src = url;
                    preview.controls = true;
                    preview.preload = 'metadata';
                    preview.style.maxWidth = '100%';
                    preview.style.maxHeight = '200px';
                    preview.setAttribute('aria-label', item.alt_text || item.file);
                    details.push(preview);
                } else if (isAudio) {
                    const preview = document.createElement('audio');
                    preview.src = url;
                    preview.controls = true;
                    preview.preload = 'metadata';
                    preview.style.width = '100%';
                    preview.setAttribute('aria-label', item.alt_text || item.file);
                    details.push(preview);
                }

                details.push(mediaDetail('파일명:', item.file));
                details.push(mediaDetail('업로드:', formatDate(item.created)));
                if (item.alt_text) details.push(mediaDetail('대체 텍스트:', item.alt_text));
                mediaInfo.replaceChildren(...details);
                mediaUrlInput.value = url;
                document.getElementById('selectedMedia').style.display = 'block';
            } catch (e) {
                showAlert('파일 정보를 불러올 수 없습니다: ' + cmsErrorMessage(e), 'error');
            }
        }

        function mediaDetail(label, value) {
            const row = document.createElement('p');
            const heading = document.createElement('b');
            heading.textContent = label;
            row.append(heading, document.createTextNode(` ${value}`));
            return row;
        }

        // URL 복사
        function copyUrl() {
            const urlInput = document.getElementById('mediaUrl');
            urlInput.select();
            document.execCommand('copy');
            showAlert('URL이 클립보드에 복사되었습니다!', 'success');
        }

        // 미디어 삭제
        async function deleteSelectedMedia() {
            if (!selectedMediaId) return;
            if (!confirm('정말 이 파일을 삭제하시겠습니까?')) return;

            try {
                await deleteMedia(selectedMediaId);
                showAlert('파일이 삭제되었습니다.', 'success');
                document.getElementById('selectedMedia').style.display = 'none';
                selectedMediaId = null;
                loadMedia(currentPage);
            } catch (e) {
                showAlert('삭제 실패: ' + cmsErrorMessage(e), 'error');
            }
        }

        // 초기 로드
        loadMedia();
    </script>
</body>

</html>
