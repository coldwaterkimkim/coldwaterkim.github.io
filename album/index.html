<!DOCTYPE html>
<html class="entry-gate-disabled">
<head>
  <title>앨범 — coldwaterkim</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/public-base.css">
  <script type="module" src="/js/maintenance-gate.js"></script>
  <script type="module" src="/js/public-runtime.js"></script>
  <link rel="stylesheet" href="/css/records-v2.css">
  <link rel="stylesheet" href="/css/sketch-shell.css">
  <link rel="stylesheet" href="/css/sketch-album.css">
</head>
<body class="sketch-site page-subpage page-album">
  <main class="sketch-content" id="sketch-content">
    <h1 class="sketch-album-heading" aria-label="앨범"><svg viewBox="409 126 210 117" aria-hidden="true" focusable="false"><image href="/assets/sketch/album-wire.png" width="1024" height="1536" /></svg></h1>
    <div class="album-toolbar">
      <span id="album-status">불러오는 중...</span>
      <button type="button" id="album-edit-toggle" class="album-owner-only" hidden>분류 편집</button>
    </div>
    <div class="album-filter-row"><b>분류:</b> <span id="album-tag-filters">[ <a href="/album/index.html" data-album-tag="">전체</a> ]</span></div>
    <div class="album-filter-row"><b>형식:</b> <span id="album-kind-filters">[ <a href="/album/index.html" data-album-kind="">모두</a> | <a href="/album/index.html?kind=image" data-album-kind="image">사진</a> | <a href="/album/index.html?kind=video" data-album-kind="video">영상</a> ]</span></div>
    <div id="album-tag-manager" class="album-tag-manager album-owner-only" hidden>
      <form id="album-tag-create-form" class="album-tag-create-form">
        <label for="album-tag-name"><b>새 태그:</b></label>
        <input type="text" id="album-tag-name" maxlength="30" required>
        <button type="submit">생성</button>
      </form>
      <div id="album-tag-manager-list" class="album-tag-manager-list"></div>
    </div>
    <div id="album-selection-bar" class="album-selection-bar" hidden>
      <b><span id="album-selection-count">0</span>개 선택</b>
      <span id="album-selection-tags"></span>
      <button type="button" id="album-selection-clear">선택 해제</button>
    </div>
    <div id="album-grid" class="album-grid" aria-live="polite"><p class="album-message">앨범을 불러오는 중...</p></div>
    <div id="album-pagination" class="album-pagination"></div>
    <div id="album-scroll-sentinel" class="album-scroll-sentinel" aria-hidden="true"></div>
  </main>
  <div class="mini-player" data-bgm-runtime hidden><audio data-bgm preload="none"></audio></div>
  <script type="module">
    import { initAlbumPage } from '../js/album.js';
    initAlbumPage();
  </script>
  <script type="module" src="/js/sketch-shell.js"></script>
</body>
</html>
