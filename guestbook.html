<body class="sketch-site page-subpage sketch-guestbook">
  <main class="sketch-content" id="sketch-content">
    <h1 class="sketch-page-title"><span class="sketch-heading-label">방명록!</span><svg aria-hidden="true" viewBox="305 131 410 159"><image href="/assets/sketch/guestbook-wire.png" width="1024" height="1536"/></svg></h1>
    <p class="note">
      📌 방명록은 누구나 작성할 수 있습니다.
      💌 주인장의 답글도 여기서 확인할 수 있습니다.
      🚫 부적절한 내용은 내 마음대로 삭제할꼬얌.ㅋ
    </p>

    <form id="guestbookForm">
      <table border="1" cellspacing="0" cellpadding="6" width="100%">
        <tr bgcolor="#f0f0f0">
          <th align="left">방명록에 한 줄 남기기</th>
        </tr>
        <tr>
          <td>
            <label for="guestName"><b>닉네임</b></label><br>
            <input id="guestName" type="text" maxlength="50" placeholder="익명의 누군가" style="width: 220px;">
            <p style="margin: 6px 0 8px;">
              <small>비워두면 자동으로 익명 이름이 붙습니다.</small>
            </p>
            <label for="message"><b>메시지</b></label><br>
            <textarea id="message" rows="4" style="width: 100%;" maxlength="1000" aria-describedby="guestbookMessageHelp" required></textarea>
            <p id="guestbookMessageHelp" class="note">최대 1,000자 · <span id="guestbookMessageCount">0</span> / 1,000자</p>
            <p>
              <button type="submit" id="guestbookSubmit" aria-busy="false"
                style="padding: 8px; font-weight: bold; cursor: pointer;">
                ✏️ 남기기
              </button>
              <span id="guestbookSubmitStatus" role="status" aria-live="polite"></span>
            </p>
          </td>
        </tr>
      </table>
    </form>

    <h2 class="visitor-heading">방명록 목록</h2>
    <div id="guestbookEntries">
      <p>불러오는 중...</p>
    </div>
  </main>
  <div class="mini-player" data-bgm-runtime hidden><audio data-bgm preload="none"></audio></div>
