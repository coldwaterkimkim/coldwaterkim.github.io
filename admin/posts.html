<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>글 관리 — coldwaterkim OWNER MODE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1>★ coldwaterkim OWNER MODE ★</h1>
            <div>
                <a href="../index.html">🏠 홈으로</a> |
                <a href="#" id="logoutBtn">🚪 로그아웃</a>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="admin-nav">
            <a href="/">🏠 사이트 보기</a>
            <a href="/admin/write.html">✍️ 통합 글쓰기</a>
            <a href="/admin/posts.html" class="active">📝 글 관리</a>
            <a href="/admin/daily.html">📅 나으 하루</a>
            <a href="/admin/media.html">🖼️ 미디어</a>
            <a href="/admin/guestbook.html">💬 방명록</a>
        </nav>

        <!-- Content -->
        <div class="admin-content">
            <div id="alert" class="alert" style="display: none;"></div>

            <!-- 글 목록 뷰 -->
            <div id="listView">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="margin: 0;">📝 글 목록</h2>
                    <button class="btn btn-primary" onclick="showEditor()">✚ 새 글 쓰기</button>
                </div>

                <table class="admin-table" id="postsTable">
                    <thead>
                        <tr>
                            <th>제목</th>
                            <th style="width: 80px;">상태</th>
                            <th style="width: 120px;">날짜</th>
                            <th style="width: 90px;">조회수</th>
                            <th style="width: 140px;">액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="loading">불러오는 중</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination" id="pagination"></div>
            </div>

            <!-- 에디터 뷰 -->
            <div id="editorView" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="margin: 0;" id="editorTitle">✍️ 새 글 쓰기</h2>
                    <button type="button" class="btn" id="backToListBtn" aria-busy="false"
                        onclick="showList()">← 목록으로</button>
                </div>

                <form id="postForm">
                    <input type="hidden" id="postId">
                    <input type="hidden" id="slug">
                    <input type="hidden" id="status" value="draft">

                    <div class="admin-panel">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="title">제목 *</label>
                                <input type="text" id="title" required placeholder="멋진 제목을 입력하세요">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="published_at">발행일</label>
                                <input type="date" id="published_at">
                            </div>
                        </div>
                    </div>

                    <div class="admin-panel">
                        <h2>본문</h2>
                        <div class="editor-container">
                            <div id="editor"></div>
                        </div>
                        <input type="file" id="editorImageInput" accept="image/*,video/mp4,video/webm,video/quicktime,.m4v,audio/mpeg,.mp3,application/pdf" multiple hidden>
                        <div id="editorImageStatus" class="editor-image-status" aria-live="polite"></div>
                    </div>

                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary" id="saveBtn" aria-busy="false">💾 저장</button>
                        <button type="button" class="btn btn-success" id="publishBtn" aria-busy="false"
                            onclick="saveAndPublish()">🚀 저장 후 발행</button>
                        <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;"
                            aria-busy="false" onclick="deleteCurrentPost()">🗑️ 삭제</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { pb, isLoggedIn, logout, getAllPosts, deletePost, formatDate, slugify, cmsErrorMessage, uploadMedia, getMediaUrl, getPostViewCounts, escapeHtml, getKstDateKey, formatMediaUploadProgress, finalizePublishedEditorMedia } from '../js/pb.js';
        import {
            createEditorUploadCoordinator,
            createMarkdownEditor,
            editorFilesFromTransfer,
            editorUploadLabel,
            hasEditorFileTransfer,
            isSupportedEditorUpload,
            normalizeEditorFiles,
            stopEditorTransferEvent
        } from '../js/markdown-editor.js';
        import { navigateToPublishedEntry } from '../js/editor-publish-navigation.mjs';
        import { createPendingMediaTracker } from '../js/editor-pending-media.mjs';

        // 인증 체크
        if (!isLoggedIn()) {
            window.location.replace('/admin/login.html');
            await new Promise(() => { });
        }

        // 로그아웃
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
            window.location.href = '/admin/login.html';
        });

        // Markdown 에디터 초기화
        let pendingEditorImageIndex = null;
        const pendingMediaTracker = createPendingMediaTracker();
        const editorUploadCoordinator = createEditorUploadCoordinator({
            uploadFile: uploadEditorRecord
        });
        const markdownEditor = await createMarkdownEditor('#editor', {
            placeholder: 'Markdown으로 글을 작성하세요...',
            fallbackNamePrefix: 'post-editor-file',
            onImageButton: () => {
                pendingEditorImageIndex = currentEditorIndex();
                editorImageInput.click();
            },
            uploadFile: uploadEditorFile,
            onFilesPaste: files => insertEditorFiles(files, {
                index: currentEditorIndex()
            }),
            onFilesPasteError: error => showAlert(`붙여넣기 실패: ${cmsErrorMessage(error)}`, 'error')
        });

        const editorContainer = document.querySelector('.editor-container');
        const editorImageInput = document.getElementById('editorImageInput');
        const editorImageStatus = document.getElementById('editorImageStatus');

        editorImageInput.addEventListener('change', async () => {
            await insertEditorFiles(editorImageInput.files, {
                index: pendingEditorImageIndex
            });
            pendingEditorImageIndex = null;
            editorImageInput.value = '';
        });

        editorContainer.addEventListener('dragenter', (event) => {
            if (!hasEditorFileTransfer(event.dataTransfer)) return;
            event.preventDefault();
            editorContainer.classList.add('is-image-dragover');
        });

        editorContainer.addEventListener('dragover', (event) => {
            if (!hasEditorFileTransfer(event.dataTransfer)) return;
            event.preventDefault();
            editorContainer.classList.add('is-image-dragover');
        });

        editorContainer.addEventListener('dragleave', (event) => {
            if (event.relatedTarget instanceof Node && editorContainer.contains(event.relatedTarget)) return;
            editorContainer.classList.remove('is-image-dragover');
        });

        editorContainer.addEventListener('drop', async (event) => {
            if (!hasEditorFileTransfer(event.dataTransfer)) return;
            stopEditorTransferEvent(event);
            editorContainer.classList.remove('is-image-dragover');

            const files = transferredEditorFiles(event.dataTransfer);
            if (!files.length) {
                showAlert('지원하는 이미지나 영상 파일만 본문에 넣을 수 있습니다.', 'error');
                return;
            }

            await insertEditorFiles(files, {
                index: currentEditorIndex()
            });
        }, true);

        // 상태 변수
        let currentPage = 1;
        let editingPostId = null;
        let editorActionInFlight = false;
        let editorLoadGeneration = 0;
        const postForm = document.getElementById('postForm');
        const backToListButton = document.getElementById('backToListBtn');
        const saveButton = document.getElementById('saveBtn');
        const publishButton = document.getElementById('publishBtn');
        const deleteButton = document.getElementById('deleteBtn');

        // 페이지 함수들을 전역으로 노출
        window.showEditor = showEditor;
        window.showList = showList;
        window.editPost = editPost;
        window.confirmDelete = confirmDelete;
        window.saveAndPublish = saveAndPublish;
        window.deleteCurrentPost = deleteCurrentPost;
        window.goToPage = goToPage;

        // 알림 표시
        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type}`;
            alertEl.style.display = 'block';
            setTimeout(() => alertEl.style.display = 'none', 5000);
        }

        function setEditorActionBusy(isBusy) {
            postForm.setAttribute('aria-busy', String(isBusy));
            editorContainer.inert = isBusy;
            editorContainer.setAttribute('aria-disabled', String(isBusy));
            postForm.querySelectorAll('button, input, select, textarea').forEach(control => {
                control.disabled = isBusy;
            });
            [backToListButton, saveButton, publishButton, deleteButton].forEach(button => {
                button.setAttribute('aria-busy', String(isBusy));
            });
        }

        async function runEditorAction(action) {
            if (editorActionInFlight) return null;
            if (markdownEditor.hasUploadActivity()) {
                showAlert('미디어 업로드가 끝난 뒤 다시 시도해주세요.', 'error');
                return null;
            }
            editorActionInFlight = true;
            setEditorActionBusy(true);

            try {
                return await action();
            } catch (error) {
                showAlert('처리 실패: ' + cmsErrorMessage(error), 'error');
                return null;
            } finally {
                editorActionInFlight = false;
                setEditorActionBusy(false);
            }
        }

        function setEditorImageStatus(message = '', type = 'info') {
            editorImageStatus.textContent = message;
            editorImageStatus.className = `editor-image-status editor-image-status-${type}`;
            editorImageStatus.classList.toggle('is-visible', Boolean(message));
        }

        function transferredEditorFiles(dataTransfer) {
            return editorFilesFromTransfer(dataTransfer, {
                fallbackNamePrefix: 'post-editor-file'
            });
        }

        function clampEditorIndex(index) {
            return markdownEditor.clampIndex(index);
        }

        function currentEditorIndex() {
            const range = markdownEditor.getSelection(true);
            return clampEditorIndex(range?.index);
        }

        async function insertEditorFiles(files, options = {}) {
            if (editorActionInFlight) {
                showAlert('저장 작업이 끝난 뒤 미디어를 추가해주세요.', 'error');
                return;
            }
            const editorFiles = normalizeEditorFiles(files, {
                fallbackNamePrefix: 'post-editor-file'
            });

            if (!editorFiles.length) {
                showAlert('JPG, PNG, GIF, WebP, MP4, WebM, MOV, M4V, MP3, PDF만 올릴 수 있습니다.', 'error');
                return;
            }

            let insertIndex = clampEditorIndex(options.index);
            await markdownEditor.withUploadActivity(async () => {
                await editorUploadCoordinator.runBatch(editorFiles, {
                    onFileStart: (file, index, total) => {
                        setEditorImageStatus(`${editorUploadLabel(file)} 업로드 준비 중... (${index + 1}/${total}) ${file.name}`);
                    },
                    onFileProgress: (file, progress, index, total) => {
                        setEditorImageStatus(`${editorUploadLabel(file)} ${formatMediaUploadProgress(progress)} (${index + 1}/${total}) ${file.name}`);
                    },
                    onFileReused: (file, _result, index, total) => {
                        setEditorImageStatus(`이미 올린 ${editorUploadLabel(file)} 재사용 중... (${index + 1}/${total}) ${file.name}`);
                    },
                    onFileError: (file, error) => {
                        showAlert(`${editorUploadLabel(file)} 업로드 실패 (${file.name}): ${cmsErrorMessage(error)}`, 'error');
                    },
                    onDuplicateBatch: () => {
                        setEditorImageStatus('같은 붙여넣기가 겹쳐서 한 번만 처리했습니다.', 'success');
                    },
                    onComplete: uploaded => {
                        const uploadedFiles = uploaded.map(item => item.result);
                        insertIndex = markdownEditor.insertFiles(insertIndex, uploadedFiles);
                        markdownEditor.setSelection(insertIndex, 0, 'silent');
                        setEditorImageStatus(`${uploadedFiles.length}개 미디어가 본문에 들어갔습니다.`, 'success');
                        setTimeout(() => setEditorImageStatus(), 2500);
                    }
                });
            });
        }

        async function uploadEditorFile(file) {
            if (editorActionInFlight) {
                throw new Error('저장 작업이 끝난 뒤 미디어를 추가해주세요.');
            }
            if (!isSupportedEditorUpload(file)) {
                throw new Error('JPG, PNG, GIF, WebP, MP4, WebM, MOV, M4V, MP3, PDF만 올릴 수 있습니다.');
            }

            try {
                const uploaded = await editorUploadCoordinator.uploadSingle(file, {
                    onFileStart: current => setEditorImageStatus(`${editorUploadLabel(current)} 업로드 준비 중... ${current.name || ''}`),
                    onFileProgress: (current, progress) => setEditorImageStatus(`${editorUploadLabel(current)} ${formatMediaUploadProgress(progress)} ${current.name || ''}`),
                    onFileReused: current => setEditorImageStatus(`이미 올린 ${editorUploadLabel(current)}를 재사용합니다.`, 'success')
                });
                setEditorImageStatus(`${editorUploadLabel(file)} 업로드 완료.`, 'success');
                setTimeout(() => setEditorImageStatus(), 1800);
                return uploaded.url;
            } catch (error) {
                setEditorImageStatus(`${editorUploadLabel(file)} 업로드 실패: ${cmsErrorMessage(error)}`, 'error');
                throw error;
            }
        }

        async function uploadEditorRecord(file, options = {}) {
            const media = await uploadMedia(file, file.name, 'Post editor media', options);
            pendingMediaTracker.add(media.id);
            return {
                url: getMediaUrl(media, media.file),
                name: file.name,
                type: file.type
            };
        }

        // 목록 뷰
        function showList() {
            if (editorActionInFlight) return false;
            editorLoadGeneration += 1;
            document.getElementById('listView').style.display = 'block';
            document.getElementById('editorView').style.display = 'none';
            editingPostId = null;
            loadPosts();
            return true;
        }

        // 에디터 뷰
        function showEditor(post = null, expectedLoadGeneration = null) {
            if (editorActionInFlight) return false;
            if (expectedLoadGeneration !== null && expectedLoadGeneration !== editorLoadGeneration) return false;
            if (expectedLoadGeneration === null) editorLoadGeneration += 1;
            document.getElementById('listView').style.display = 'none';
            document.getElementById('editorView').style.display = 'block';

            if (post) {
                pendingMediaTracker.reset(post.pending_media_ids);
                // 수정 모드
                document.getElementById('editorTitle').textContent = '✏️ 글 수정';
                document.getElementById('postId').value = post.id;
                document.getElementById('title').value = post.title || '';
                document.getElementById('slug').value = post.slug || '';
                document.getElementById('status').value = post.status || 'draft';
                document.getElementById('published_at').value = post.published_at ? post.published_at.split('T')[0] : '';
                markdownEditor.root.innerHTML = post.content || '';
                document.getElementById('deleteBtn').style.display = 'inline-block';
                editingPostId = post.id;
            } else {
                pendingMediaTracker.reset();
                // 새 글 모드
                document.getElementById('editorTitle').textContent = '✍️ 새 글 쓰기';
                document.getElementById('postForm').reset();
                document.getElementById('postId').value = '';
                document.getElementById('slug').value = '';
                document.getElementById('status').value = 'draft';
                markdownEditor.root.innerHTML = '';
                document.getElementById('deleteBtn').style.display = 'none';
                editingPostId = null;

                // 오늘 날짜 기본값
                document.getElementById('published_at').value = getKstDateKey();
            }
            return true;
        }

        // 글 목록 로드
        async function loadPosts(page = 1) {
            const tbody = document.querySelector('#postsTable tbody');
            tbody.innerHTML = '<tr><td colspan="5" class="loading">불러오는 중</td></tr>';

            try {
                const result = await getAllPosts(page, 10);
                currentPage = page;

                if (result.items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">아직 글이 없습니다. 첫 번째 글을 작성해보세요!</td></tr>';
                    return;
                }

                const viewCounts = await getPostViewCounts(result.items.map(post => post.id));

                tbody.innerHTML = result.items.map(post => `
          <tr>
            <td>
              <a href="javascript:void(0)" onclick="editPost('${post.id}')">${escapeHtml(post.title || '(제목 없음)')}</a>
            </td>
            <td><span class="badge badge-${post.status}">${post.status === 'published' ? '발행' : '초안'}</span></td>
            <td>${formatDate(post.published_at || post.created)}</td>
            <td class="post-view-count">${formatOwnerViewCount(viewCounts[post.id])}</td>
            <td>
              <button class="btn" onclick="editPost('${post.id}')" style="padding: 4px 8px;">✏️</button>
              <button class="btn btn-danger" onclick="confirmDelete('${post.id}')" style="padding: 4px 8px;">🗑️</button>
              ${post.status === 'published' ? `<a href="/posts/view.html?slug=${post.slug}" target="_blank" class="btn" style="padding: 4px 8px; text-decoration: none;">👁️</a>` : ''}
            </td>
          </tr>
        `).join('');

                // 페이지네이션
                renderPagination(result.totalPages, page);
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5">불러오기 실패: ' + cmsErrorMessage(e) + '</td></tr>';
            }
        }

        function formatOwnerViewCount(count) {
            if (!Number.isFinite(count)) return '-';
            return Number(count).toLocaleString('ko-KR');
        }

        // 페이지네이션 렌더링
        function renderPagination(totalPages, currentPage) {
            const paginationEl = document.getElementById('pagination');
            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<span class="current">${i}</span>`;
                } else {
                    html += `<a href="javascript:void(0)" onclick="goToPage(${i})">${i}</a>`;
                }
            }
            paginationEl.innerHTML = html;
        }

        function goToPage(page) {
            loadPosts(page);
        }

        // 글 수정 (ID로 불러오기)
        async function editPost(id) {
            if (editorActionInFlight) return false;
            const loadGeneration = ++editorLoadGeneration;
            try {
                try {
                    const record=await pb.send('/api/cwk/records-v2/'+encodeURIComponent('posts:'+id),{method:'GET',requestKey:null});
                    if(record.id&&!record.id.includes(':')){location.href='/#edit/'+encodeURIComponent(record.id);return false;}
                }catch(error){if(error.status!==404)throw error;}
                const post = await pb.collection('posts').getOne(id);
                if (loadGeneration !== editorLoadGeneration) return false;
                return showEditor(post, loadGeneration);
            } catch (e) {
                if (loadGeneration !== editorLoadGeneration) return false;
                showAlert('글을 불러올 수 없습니다: ' + cmsErrorMessage(e), 'error');
                return false;
            }
        }

        // 글 삭제 확인
        async function confirmDelete(id, { reloadList = true } = {}) {
            if (!confirm('정말 이 글을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return false;

            try {
                let mapped;
                try{mapped=await pb.send('/api/cwk/records-v2/'+encodeURIComponent('posts:'+id),{method:'GET',requestKey:null});}
                catch(error){if(error.status!==404)throw error;}
                if(mapped?.id&&!mapped.id.includes(':'))await pb.send('/api/cwk/records-v2/'+encodeURIComponent(mapped.id),{method:'DELETE',query:{revision:mapped.revision},requestKey:null});
                else await deletePost(id);
                showAlert('글이 삭제되었습니다.', 'success');
                if (reloadList) await loadPosts(currentPage);
                return true;
            } catch (e) {
                showAlert('삭제 실패: ' + cmsErrorMessage(e), 'error');
                return false;
            }
        }

        // 현재 글 삭제
        async function deleteCurrentPost() {
            if (!editingPostId) return;
            const deleted = await runEditorAction(() =>
                confirmDelete(editingPostId, { reloadList: false })
            );
            if (deleted) showList();
            return deleted;
        }

        // 폼 제출 (저장)
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await runEditorAction(() => savePost());
        });

        // 저장 후 발행
        async function saveAndPublish() {
            return runEditorAction(async () => {
                const publishContent = markdownEditor.root.innerHTML;
                const publishPendingMediaIds = pendingMediaTracker.values();
                const saved = await savePost({
                    statusOverride: 'published',
                    contentOverride: publishContent,
                    pendingMediaIdsOverride: publishPendingMediaIds
                });
                if (!saved) return null;

                const cleanup = await finalizePublishedEditorMedia({
                    collectionName: 'posts',
                    recordId: saved.id,
                    content: publishContent,
                    pendingMediaIds: publishPendingMediaIds
                });
                pendingMediaTracker.reset(cleanup.remaining);
                if (cleanup.failures.length || cleanup.metadataError) {
                    console.warn('Published post media cleanup needs retry', cleanup);
                }
                navigateToPublishedEntry('posts', saved);
                return saved;
            });
        }

        // 글 저장
        async function savePost({
            statusOverride = null,
            contentOverride = null,
            pendingMediaIdsOverride = null
        } = {}) {
            const id = document.getElementById('postId').value;
            const title = document.getElementById('title').value.trim();
            let slug = document.getElementById('slug').value.trim();
            const status = statusOverride ?? document.getElementById('status').value;
            const published_at = document.getElementById('published_at').value || null;
            const content = contentOverride ?? markdownEditor.root.innerHTML;
            const pendingMediaIds = pendingMediaIdsOverride ?? pendingMediaTracker.values();

            // 슬러그 자동 생성
            if (!slug) {
                slug = slugify(title) || `post-${Date.now()}`;
                document.getElementById('slug').value = slug;
            }

            // FormData 생성
            const formData = new FormData();
            formData.append('title', title);
            formData.append('slug', slug);
            formData.append('status', status);
            formData.append('content', content);
            formData.append('pending_media_ids', JSON.stringify(pendingMediaIds));
            if (published_at) formData.append('published_at', published_at);

            try {
                let result;
                if (id) {
                    result = await pb.collection('posts').update(id, formData);
                    showAlert('글이 수정되었습니다!', 'success');
                } else {
                    result = await pb.collection('posts').create(formData);
                    document.getElementById('postId').value = result.id;
                    editingPostId = result.id;
                    document.getElementById('deleteBtn').style.display = 'inline-block';
                    showAlert('글이 저장되었습니다!', 'success');
                }
                document.getElementById('status').value = result.status || status;
                return result;
            } catch (e) {
                showAlert('저장 실패: ' + cmsErrorMessage(e), 'error');
                return null;
            }
        }

        // 제목 → 내부 URL 슬러그 자동 생성
        document.getElementById('title').addEventListener('input', () => {
            if (!editingPostId) {
                document.getElementById('slug').value = slugify(document.getElementById('title').value);
            }
        });

        // 초기 로드
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('new') === '1') {
            showEditor();
        } else if (urlParams.get('id')) {
            editPost(urlParams.get('id'));
        } else {
            loadPosts();
        }
    </script>
</body>

</html>
