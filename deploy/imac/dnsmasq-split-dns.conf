# coldwaterkim.com split DNS for the home LAN.
# The router advertises this iMac (192.168.0.11) as the only DHCP DNS server.

port=53
listen-address=127.0.0.1,192.168.0.11
bind-interfaces
user=nobody
group=nobody

no-resolv
strict-order
server=168.126.63.1
server=168.126.63.2

host-record=coldwaterkim.com,192.168.0.11
host-record=www.coldwaterkim.com,192.168.0.11

domain-needed
bogus-priv
stop-dns-rebind
cache-size=1000
local-ttl=60
neg-ttl=60
log-facility=-
