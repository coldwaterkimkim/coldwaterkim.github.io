<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>통합 작성기로 이동 — coldwaterkim</title><link rel="stylesheet" href="/css/admin.css"></head>
<body class="admin-body"><p>작성과 수정은 통합 피드에서 이어집니다. <a id="writerDestination" href="/#daily">피드로 이동</a></p>
<script type="module">
const params = new URLSearchParams(location.search);
const id = params.get('id');
const destination = id ? '/#edit/' + encodeURIComponent('daily_entries:' + id) : params.get('new') === '1' ? '/#compose' : '/#daily';
document.getElementById('writerDestination').href = destination;
location.replace(destination);
</script></body></html>
